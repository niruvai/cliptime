<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipTime – Free Clipboard History & Text Tools for Chrome</title>
<meta name="description" content="Free and open-source Chrome extension: clipboard history saved for 30 days, one-click blank-line remover, case converter and reusable text snippets.">
<link rel="icon" href="icon128.png">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d1b16; --ink2:#5d584c; --ink3:#8f897b; --line:#e3dfd4; --accent:#0f766e; --accent2:#d9efec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161512; --card:#201f1b; --ink:#eeebe3; --ink2:#b4ae9f; --ink3:#7e786b; --line:#34322c; --accent:#2dd4bf; --accent2:#123b37; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "Segoe UI",system-ui,-apple-system,"Noto Sans Bengali","Nirmala UI","Hind Siliguri",sans-serif; }
  a { color:var(--accent); }
  .wrap { max-width:980px; margin:0 auto; padding:0 16px; }
  header { padding:18px 0; display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; }
  header img { width:32px; height:32px; }
  .lang { margin-left:auto; display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .lang button { border:0; background:none; padding:4px 12px; font:inherit; font-size:13px; font-weight:600; color:var(--ink2); cursor:pointer; }
  .lang button.on { background:var(--ink); color:var(--bg); }
  .hero { padding:36px 0 30px; display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center; }
  .badge { display:inline-block; background:var(--accent2); color:var(--accent); font-weight:700; font-size:13px; padding:3px 12px; border-radius:999px; margin-bottom:14px; }
  .hero h1 { font-size:clamp(30px,5vw,46px); line-height:1.15; margin:0 0 14px; letter-spacing:-.5px; }
  .hero p { color:var(--ink2); font-size:18px; margin:0 0 22px; }
  .hero img { width:100%; max-width:380px; justify-self:center; border-radius:12px; border:1px solid var(--line); box-shadow:0 20px 50px -20px rgba(0,0,0,.3); }
  .btn { display:inline-block; text-decoration:none; font-weight:700; border-radius:10px; padding:12px 22px; border:2px solid var(--accent); color:var(--accent); margin:0 8px 8px 0; }
  .btn.solid { background:var(--accent); color:#fff; }
  h2 { font-size:28px; margin:0 0 22px; text-align:center; }
  section { padding:40px 0; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .card .ic { font-size:26px; }
  .card h3 { margin:6px 0 6px; font-size:17px; }
  .card p { margin:0; color:var(--ink2); font-size:14.5px; }
  .faq details { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin:0 auto 10px; max-width:780px; }
  .faq summary { font-weight:700; cursor:pointer; }
  .oss { text-align:center; max-width:640px; margin:0 auto; color:var(--ink2); }
  footer { padding:30px 0 50px; text-align:center; color:var(--ink3); font-size:14px; }
  footer a { color:var(--ink2); }
  @media (max-width:760px) { .hero, .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon128.png" alt=""> ClipTime
    <div class="lang"><button data-l="en">English</button><button data-l="bn">বাংলা</button></div>
  </header>

  <div class="hero">
    <div>
      <span class="badge" data-t="badge"></span>
      <h1 data-t="h1"></h1>
      <p data-t="lead"></p>
      <a class="btn solid" id="install" href="#" data-t="install"></a>
      <a class="btn" href="https://github.com/niruvai/cliptime" data-t="source"></a>
    </div>
    <img src="popup.png" alt="ClipTime">
  </div>
</div>

<section>
  <div class="wrap">
    <h2 data-t="featTitle"></h2>
    <div class="grid">
      <div class="card"><div class="ic">📋</div><h3 data-t="f1h"></h3><p data-t="f1"></p></div>
      <div class="card"><div class="ic">💾</div><h3 data-t="f2h"></h3><p data-t="f2"></p></div>
      <div class="card"><div class="ic">🧹</div><h3 data-t="f3h"></h3><p data-t="f3"></p></div>
      <div class="card"><div class="ic">🔠</div><h3 data-t="f4h"></h3><p data-t="f4"></p></div>
      <div class="card"><div class="ic">✍️</div><h3 data-t="f5h"></h3><p data-t="f5"></p></div>
      <div class="card"><div class="ic">🔒</div><h3 data-t="f6h"></h3><p data-t="f6"></p></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap oss">
    <h2 data-t="ossTitle"></h2>
    <p data-t="oss"></p>
    <a class="btn" href="https://github.com/niruvai/cliptime/issues" data-t="issue"></a>
  </div>
</section>

<section class="faq">
  <div class="wrap">
    <h2 data-t="faq"></h2>
    <details><summary data-t="q1"></summary><p data-t="a1"></p></details>
    <details><summary data-t="q2"></summary><p data-t="a2"></p></details>
    <details><summary data-t="q3"></summary><p data-t="a3"></p></details>
    <details><summary data-t="q4"></summary><p data-t="a4"></p></details>
  </div>
</section>

<footer class="wrap">ClipTime · MIT License · <a href="https://github.com/niruvai/cliptime/blob/main/PRIVACY.md" data-t="privacy"></a> · <a href="https://github.com/niruvai/cliptime">GitHub</a></footer>

<script>
  // Put your Chrome Web Store link here once the extension is published
  const CHROME_STORE_URL = 'https://github.com/niruvai/cliptime/releases/latest';

  const T = {
    en: {
      badge: '100% free · open source', h1: 'Everything you copy,<br>remembered.',
      lead: 'Clipboard history for Chrome that survives restarts. Remove blank lines in one click, convert case, and keep reusable snippets — free for everyone.',
      install: 'Add to Chrome', source: 'View source on GitHub', featTitle: 'Everything included, for everyone',
      f1h: 'Clipboard history', f1: 'Every text you copy or cut in Chrome is saved — including site "Copy" buttons. Search it instantly.',
      f2h: 'Survives restarts', f2: 'Kept for 30 days by default (1 day to forever). Pin anything to keep it permanently.',
      f3h: 'One-click clean', f3: 'Remove blank lines, extra spaces and HTML tags — from the popup or the right-click menu.',
      f4h: 'Case converter', f4: 'UPPER, lower, Title, Sentence, camelCase, snake_case, kebab-case, sort and number lines, Bangla ↔ English digits.',
      f5h: 'Reusable snippets', f5: 'Type a shortcut like ;sig in any text box and your saved text appears. Works in Gmail, Facebook, WhatsApp Web…',
      f6h: 'Private by design', f6: 'No account, no tracking, no network requests. Password fields are never saved; exclude any site.',
      ossTitle: 'Free and open source', oss: 'ClipTime is MIT-licensed. Read the code, report a bug, suggest a feature or send a pull request — everyone is welcome.',
      issue: 'Report a bug / request a feature', faq: 'FAQ',
      q1: 'Is it really free?', a1: 'Yes. Every feature is free for everyone, forever. There is no paid plan, no ads and no account.',
      q2: 'Is my copied text sent anywhere?', a2: 'No. Everything stays in Chrome on your computer. ClipTime makes no network requests at all.',
      q3: 'Does history survive a restart?', a3: 'Yes — it stays after you shut down Windows or Mac, and is cleaned up automatically after the period you choose.',
      q4: 'How do I move my history to another computer?', a4: 'Settings → Export saves a backup file; Import it on the other computer.',
      privacy: 'Privacy policy',
    },
    bn: {
      badge: '১০০% ফ্রি · ওপেন সোর্স', h1: 'যা কপি করেন,<br>সব মনে রাখে।',
      lead: 'Chrome-এর জন্য ক্লিপবোর্ড হিস্ট্রি — কম্পিউটার বন্ধ করলেও থাকে। এক ক্লিকে ফাঁকা লাইন সরান, কেস বদলান, আর বারবার লেখা জিনিস স্নিপেটে রাখুন — সবার জন্য বিনামূল্যে।',
      install: 'Chrome-এ যোগ করুন', source: 'GitHub-এ কোড দেখুন', featTitle: 'সব ফিচার, সবার জন্য',
      f1h: 'ক্লিপবোর্ড হিস্ট্রি', f1: 'Chrome-এ যা কপি বা কাট করেন সব সেভ হয় — সাইটের "Copy" বাটনসহ। মুহূর্তে খুঁজে পাবেন।',
      f2h: 'রিস্টার্টেও থাকে', f2: 'ডিফল্টে ৩০ দিন থাকে (১ দিন থেকে সবসময় পর্যন্ত বাছতে পারবেন)। পিন করলে কখনো মুছবে না।',
      f3h: 'এক ক্লিকে পরিষ্কার', f3: 'ফাঁকা লাইন, বাড়তি স্পেস আর HTML ট্যাগ সরান — পপআপ বা রাইট-ক্লিক মেনু থেকে।',
      f4h: 'কেস কনভার্টার', f4: 'UPPER, lower, Title, Sentence, camelCase, snake_case, kebab-case, লাইন সাজানো ও নম্বর, বাংলা ↔ ইংরেজি সংখ্যা।',
      f5h: 'স্নিপেট', f5: 'যেকোনো টেক্সট বক্সে ;sig লিখলেই সেভ করা লেখা বসে যায়। Gmail, Facebook, WhatsApp Web সবখানে।',
      f6h: 'প্রাইভেসি', f6: 'কোনো অ্যাকাউন্ট নেই, ট্র্যাকিং নেই, ইন্টারনেটে কিছু যায় না। পাসওয়ার্ড ফিল্ড কখনো সেভ হয় না।',
      ossTitle: 'ফ্রি ও ওপেন সোর্স', oss: 'ClipTime MIT লাইসেন্সে উন্মুক্ত। কোড দেখুন, ভুল জানান, নতুন ফিচারের প্রস্তাব দিন বা নিজেই উন্নত করে পাঠান — সবাইকে স্বাগতম।',
      issue: 'ভুল জানান / ফিচার চান', faq: 'প্রশ্ন ও উত্তর',
      q1: 'সত্যিই কি ফ্রি?', a1: 'হ্যাঁ। সব ফিচার সবার জন্য সবসময় ফ্রি। কোনো পেইড প্ল্যান, বিজ্ঞাপন বা অ্যাকাউন্ট নেই।',
      q2: 'আমার কপি করা লেখা কি কোথাও যায়?', a2: 'না। সব ডেটা আপনার কম্পিউটারের Chrome-এই থাকে। ClipTime ইন্টারনেটে কিছুই পাঠায় না।',
      q3: 'কম্পিউটার বন্ধ করলে হিস্ট্রি থাকবে?', a3: 'হ্যাঁ। Windows বা Mac বন্ধ করে চালু করলেও থাকে; আপনার বাছা সময় পর নিজে থেকে মুছে যায়।',
      q4: 'অন্য কম্পিউটারে হিস্ট্রি নেব কীভাবে?', a4: 'সেটিংস → Export করে ব্যাকআপ ফাইল রাখুন, তারপর অন্য কম্পিউটারে Import করুন।',
      privacy: 'প্রাইভেসি পলিসি',
    },
  };
  function setLang(l) {
    document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = T[l][el.dataset.t] || ''; });
    document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === l));
    try { localStorage.setItem('lang', l); } catch {}
  }
  document.querySelectorAll('.lang button').forEach((b) => (b.onclick = () => setLang(b.dataset.l)));
  document.getElementById('install').href = CHROME_STORE_URL;
  const q = new URLSearchParams(location.search).get('lang');
  let saved = null; try { saved = localStorage.getItem('lang'); } catch {}
  const auto = (navigator.language || '').startsWith('bn') || Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Dhaka' ? 'bn' : 'en';
  setLang(T[q] ? q : saved || auto);
</script>
</body>
</html>
